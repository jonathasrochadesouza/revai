name: Platform CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Python 3.12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: true
          cache-dependency-glob: platform/api/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Lint and format-check
        run: |
          uv run ruff check revai tests
          uv run ruff format --check revai tests
      - name: Test
        run: uv run pytest
      - name: Build wheel and source distribution
        run: uv build
      - name: Smoke-test the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/revai-wheel" --python 3.12
          uv pip install --python "$RUNNER_TEMP/revai-wheel/bin/python" dist/*.whl
          REVAI_DATA_DIR="$RUNNER_TEMP/revai-data" "$RUNNER_TEMP/revai-wheel/bin/revai" doctor --json

  web:
    name: Web · Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: platform/web/.nvmrc
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Audit production dependencies
        run: npm run audit:prod

  containers:
    name: Containers · Compose smoke test
    runs-on: ubuntu-latest
    needs:
      - api
      - web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose --file platform/docker-compose.yml config --quiet
      - name: Build and exercise the stack
        run: |
          set -euo pipefail
          trap 'docker compose --file platform/docker-compose.yml down --volumes' EXIT
          docker compose --file platform/docker-compose.yml up --detach --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8799/api/health
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
