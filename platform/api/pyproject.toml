[project]
name = "revai-api"
# Single source of truth is `revai.__version__`; hatchling reads it at build
# time so config.py, pip metadata and the CLI banner can never drift apart.
dynamic = ["version"]
description = "RevAI Platform — local-first AI code review backend with the `revai` CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "ruamel-yaml>=0.18.0",
    "filelock>=3.16.0",
    # Phase 2: the OpenRouter adapter. Chosen over `requests` for real async
    # streaming — the pipeline consumes provider output as it arrives.
    "httpx>=0.27.0",
    # Phase 4: reliable unified-diff parsing for the deterministic pipeline.
    "unidiff>=0.7.5",
    # 0.x bundles grammars in its wheels, keeping local reviews offline.
    "tree-sitter-language-pack>=0.10.0,<1.0",
]

[project.optional-dependencies]
# Added incrementally by later phases, kept here so the roadmap is visible.
pipeline = [
    "pandas>=2.2.0",
    "tiktoken>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "httpx2",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
revai = "revai.cli:main"
revai-api = "revai.__main__:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revai"]

[tool.hatch.version]
path = "revai/__init__.py"

# ----------------------------------------------------------------------------
# Ruff — lint + format. Deliberately strict: this codebase is a code review
# tool, so it should hold itself to the standard it enforces on others.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Tests that shell out to a real CLI are excluded by default. Each one spawns
# subprocesses that can take seconds — `copilot` in particular is slow to start —
# which turned a 20-second suite into a three-minute one.
#
# Run them explicitly with:  pytest -m cli
addopts = "-m 'not cli'"

markers = [
    "cli: spawns a real CLI subprocess; slow and dependent on what is installed",
]

# ----------------------------------------------------------------------------
# Coverage — `pytest --cov` or the CI workflow. The deterministic pipeline and
# storage layer carry the product guarantees; third-party site-packages and the
# reload entrypoint are excluded. `fail_under` is enforced in CI only.
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["revai"]
omit = ["revai/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
